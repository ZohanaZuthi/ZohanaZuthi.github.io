media:
  - name: images
    label: Images
    input: public/uploads/images
    output: /uploads/images
    extensions: [jpg, jpeg, png, webp, svg]
    rename: safe
  - name: documents
    label: Documents
    input: public/uploads/documents
    output: /uploads/documents
    extensions: [pdf]
    rename: safe

content:
  - name: profile
    label: Profile
    type: file
    path: src/data/profile.json
    format: json
    fields:
      - { name: name, label: Full name, type: string, required: true }
      - { name: role, label: Professional title, type: string, required: true }
      - { name: location, label: Location, type: string }
      - { name: intro, label: Short introduction, type: text, required: true }
      - { name: about, label: About me, type: text, required: true }
      - name: email
        label: Public email
        type: string
      - name: portrait
        label: Portrait photo
        type: image
        options: { media: images }
      - name: cv
        label: CV (PDF)
        type: file
        options: { media: documents, extensions: [pdf] }
      - { name: linkedin, label: LinkedIn URL, type: string }
      - { name: github, label: GitHub URL, type: string }
      - { name: scholar, label: Google Scholar URL, type: string }
      - { name: orcid, label: ORCID URL, type: string, description: "Optional. Paste your full https://orcid.org/ profile URL. Leave empty to hide it on every page." }
      - { name: researchgate, label: ResearchGate URL, type: string }
      - { name: arxiv, label: arXiv URL, type: string }
      - { name: pubmed, label: PubMed URL, type: string }
      - { name: ieee, label: IEEE Xplore URL, type: string, description: "Optional. Paste your IEEE Xplore author profile URL." }
      - name: links
        label: Additional links
        type: object
        list: true
        description: "Optional. Paste your profile URL. Recognized websites get their platform icon automatically; other websites get a globe. Links appear on the homepage, sidebar and footer."
        fields:
          - { name: url, label: Profile or website URL, type: string, required: true }
          - { name: label, label: Nickname, type: string, description: "Optional. Display a nickname such as My IEEE profile instead of the official platform name. Leave empty to use the detected website name." }

  - name: site
    label: Site settings
    type: file
    path: src/data/site.json
    format: json
    fields:
      - { name: tagline, label: Homepage tagline, type: string, required: true }
      - { name: description, label: Search description, type: text, required: true }

  - name: career
    label: Experience, education & skills
    type: file
    path: src/data/career.json
    format: json
    fields:
      - name: experience
        label: Experience
        type: object
        list: true
        fields:
          - { name: role, label: Role, type: string, required: true }
          - { name: organization, label: Organization, type: string }
          - { name: period, label: Dates, type: string }
          - { name: description, label: Description, type: text, description: "Press Enter for a new line. Blank lines and line breaks are preserved on the About page." }
          - { name: url, label: Related URL, type: string, description: "Optional. Add an organization, project or reference website." }
          - { name: urlTitle, label: Link title, type: string, description: "Optional. The clickable text, such as Research internship or Organization website. The URL itself is never displayed." }
      - name: education
        label: Education
        type: object
        list: true
        fields:
          - { name: qualification, label: Qualification, type: string, required: true }
          - { name: institution, label: Institution, type: string }
          - { name: period, label: Dates, type: string }
          - { name: description, label: Description, type: text }
          - { name: url, label: Related URL, type: string, description: "Optional. Add an institution, degree or reference website." }
          - { name: urlTitle, label: Link title, type: string, description: "Optional. The clickable title. Uses the institution name when empty; the URL itself is not displayed." }
      - name: skills
        label: Skills
        type: object
        list: true
        fields:
          - { name: category, label: Category, type: string, required: true }
          - { name: items, label: Skills (comma-separated), type: text }

  - name: projects
    label: Projects
    type: collection
    path: src/content/projects
    format: yaml-frontmatter
    filename: "{primary}.md"
    fields:
      - { name: title, label: Title, type: string, required: true }
      - { name: summary, label: Short summary, type: text, required: true }
      - { name: date, label: Date, type: date, required: true }
      - { name: category, label: Category, type: string }
      - name: image
        label: Cover image
        type: image
        description: Optional. Upload a cover, or leave empty to preview the live project URL.
        options: { media: images }
      - { name: link, label: Live project URL, type: string }
      - { name: source, label: Source code URL, type: string }
      - { name: featured, label: Show on homepage, type: boolean }
      - { name: published, label: Published, type: boolean }
      - { name: body, label: Full story, type: rich-text }

  - name: research
    label: Research & publications
    type: collection
    path: src/content/research
    format: yaml-frontmatter
    filename: "{primary}.md"
    fields:
      - { name: title, label: Title, type: string, required: true }
      - { name: summary, label: Short summary, type: text, required: true }
      - { name: date, label: Date, type: date, required: true }
      - { name: venue, label: Journal or conference, type: string }
      - name: image
        label: Cover image
        type: image
        options: { media: images }
      - { name: link, label: Publication URL, type: string }
      - name: pdf
        label: Paper PDF
        type: file
        options: { media: documents, extensions: [pdf] }
      - { name: published, label: Published, type: boolean }
      - { name: body, label: Abstract or details, type: rich-text }

  - name: certificates
    label: Certificates
    type: collection
    path: src/content/certificates
    format: yaml-frontmatter
    filename: "{primary}.md"
    fields:
      - { name: title, label: Title, type: string, required: true }
      - { name: summary, label: Short summary, type: text, required: true }
      - { name: date, label: Issue date, type: date, required: true }
      - { name: issuer, label: Issuer, type: string }
      - name: image
        label: Certificate image
        type: image
        options: { media: images }
      - { name: link, label: Credential URL, type: string }
      - name: pdf
        label: Certificate PDF
        type: file
        options: { media: documents, extensions: [pdf] }
      - { name: published, label: Published, type: boolean }
      - { name: body, label: Details, type: rich-text }

  - name: achievements
    label: Achievements & awards
    type: collection
    path: src/content/achievements
    format: yaml-frontmatter
    filename: "{primary}.md"
    fields:
      - { name: title, label: Title, type: string, required: true }
      - { name: summary, label: Short summary, type: text, required: true }
      - { name: date, label: Date, type: date, required: true }
      - { name: organization, label: Organization, type: string }
      - name: image
        label: Image
        type: image
        options: { media: images }
      - { name: featureCover, label: Show cover in homepage gallery, type: boolean }
      - name: gallery
        label: Gallery photos
        type: object
        list: true
        description: Optional. Add multiple photos for this award or achievement. Existing cover images remain unchanged.
        fields:
          - name: image
            label: Photo
            type: image
            required: true
            options: { media: images }
          - { name: caption, label: Caption, type: string }
          - { name: title, label: Photo title, type: string, description: "Optional. Uses the award title when empty." }
          - { name: featured, label: Show in homepage gallery, type: boolean }
      - { name: link, label: More information URL, type: string }
      - { name: published, label: Published, type: boolean }
      - { name: body, label: Details, type: rich-text }

  - name: gallery
    label: Gallery
    type: collection
    path: src/content/gallery
    format: yaml-frontmatter
    filename: "{primary}.md"
    fields:
      - { name: title, label: Title, type: string, required: true }
      - { name: summary, label: Caption or short description, type: text, required: true }
      - { name: date, label: Date, type: date, required: true }
      - name: image
        label: Photo
        type: image
        required: true
        options: { media: images }
      - { name: location, label: Location or event, type: string }
      - { name: link, label: Related URL, type: string }
      - { name: featured, label: Show in homepage gallery, type: boolean }
      - { name: published, label: Published, type: boolean }
