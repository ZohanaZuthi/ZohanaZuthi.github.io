media:
  - name: images
    label: Images
    input: public/uploads/images
    output: /uploads/images
    extensions: [ jpg, jpeg, png, webp, svg ]
    rename: safe
  - name: documents
    label: Documents
    input: public/uploads/documents
    output: /uploads/documents
    extensions: [ pdf ]
    rename: safe

content:

  - name: profile
    label: Profile
    type: file
    path: src/data/profile.json
    format: json
    fields:
      - { name: name, label: Full name, type: string, required: true }
      - { name: role, label: Professional title, type: string, required: true }
      - { name: location, label: Location, type: string }
      - { name: intro, label: Short introduction, type: text, required: true }
      - { name: about, label: About me, type: text, required: true }
      - name: email
        label: Public email
        type: string
      - name: portrait
        label: Portrait photo
        type: image
        options: { media: images }
      - name: cv
        label: CV (PDF)
        type: file
        options: { media: documents, extensions: [ pdf ] }
      - { name: linkedin, label: LinkedIn URL, type: string }
      - { name: github, label: GitHub URL, type: string }
      - { name: scholar, label: Google Scholar URL, type: string }
      - { name: orcid, label: ORCID URL, type: string, description: "Optional. Paste your full https://orcid.org/ profile URL. Leave empty to hide it on every page." }
      - { name: researchgate, label: ResearchGate URL, type: string }
      - { name: arxiv, label: arXiv URL, type: string }
      - { name: pubmed, label: PubMed URL, type: string }
      - { name: ieee, label: IEEE Xplore URL, type: string, description: "Optional. Paste your IEEE Xplore author profile URL." }
      - name: links
        label: Additional links
        type: object
        list: true
        description: "Optional. Paste your profile URL. Recognized websites get their platform icon automatically; other websites get a globe. Links appear on the homepage, sidebar and footer."
        fields:
          - { name: url, label: Profile or website URL, type: string, required: true }
          - { name: label, label: Nickname, type: string, description: "Optional. Display a nickname such as My IEEE profile instead of the official platform name. Leave empty to use the detected website name." }

  - name: site
    label: Site settings
    type: file
    path: src/data/site.json
    format: json
    fields:
      - { name: tagline, label: Homepage tagline, type: string, required: true }
      - { name: description, label: Search description, type: text, required: true }
      - { name: siteUrl, label: Website URL, type: string, description: "Optional for USERNAME.github.io repositories (detected automatically during deployment). Enter your full https:// URL when using a custom domain. Used for Google canonical URLs, sitemap and sharing." }
      - { name: socialImage, label: Default sharing image, type: image, description: "Optional. A wide image for previews when your portfolio link is shared. A 1200 × 630 image works well. Your portrait is used when empty." }
      - { name: googleSiteVerification, label: Google Search Console verification code, type: string, description: "Optional. Paste only the content value from Google's HTML verification meta tag, not the full tag." }
      - { name: analyticsMeasurementId, label: Google Analytics measurement ID, type: string, description: "Optional. G-XXXXXXXXXX enables visitor tracking. Leave blank to disable it." }
      - { name: analyticsPropertyId, label: Google Analytics property ID, type: string, description: "Optional. Numeric property ID for your private /analytics/ dashboard. This is different from the G- measurement ID." }
      - { name: analyticsClientId, label: Google OAuth client ID, type: string, description: "Optional. Web application client ID ending in .apps.googleusercontent.com. Never enter a client secret. See README for one-time setup." }

  - name: career
    label: Experience, education & skills
    type: file
    path: src/data/career.json
    format: json
    fields:
      - name: experience
        label: Experience
        type: object
        list: true
        fields:
          - { name: role, label: Role, type: string, required: true }
          - { name: organization, label: Organization, type: string }
          - { name: period, label: Dates, type: string }
          - { name: description, label: Description, type: text, description: "Press Enter for a new line. Blank lines and line breaks are preserved on the About page." }
          - { name: url, label: Related URL, type: string, description: "Optional. Add an organization, project or reference website." }
          - { name: urlTitle, label: Link title, type: string, description: "Optional. The clickable text, such as Research internship or Organization website. The URL itself is never displayed." }
      - name: education
        label: Education
        type: object
        list: true
        fields:
          - { name: qualification, label: Qualification, type: string, required: true }
          - { name: institution, label: Institution, type: string }
          - { name: period, label: Dates, type: string }
          - { name: description, label: Description, type: text }
          - { name: url, label: Related URL, type: string, description: "Optional. Add an institution, degree or reference website." }
          - { name: urlTitle, label: Link title, type: string, description: "Optional. The clickable title. Uses the institution name when empty; the URL itself is not displayed." }
          - name: links
            label: Additional URLs
            type: object
            list: true
            description: Optional. Add extra education links with your own clickable labels.
            fields:
              - { name: url, label: URL, type: string, required: true }
              - { name: label, label: Label text, type: string, required: true }
      - name: skills
        label: Skills
        type: object
        list: true
        fields:
          - { name: category, label: Category, type: string, required: true }
          - { name: items, label: Skills (comma-separated), type: text }

  - name: projects
    label: Projects
    type: file
    path: src/lists/projects.json
    format: json
    fields:
      - { name: id, label: Page address, type: string, description: "Optional for new entries: uses the title when empty. Keep existing addresses unchanged to retain shared links." }
      - { name: title, label: Title, type: string, required: true }
      - { name: summary, label: Short summary, type: text, description: "Optional. Leave empty to show just the project title, photos and links." }
      - { name: date, label: Date, type: date, required: true }
      - { name: category, label: Category, type: string }
      - name: image
        label: Cover image
        type: image
        description: Optional. Upload a cover, or leave empty to preview the live project URL.
        options: { media: images }
      - name: gallery
        label: Project photos
        type: object
        list: true
        description: "Optional. Add multiple images with captions. All photos appear directly on Projects in rows of three and on the detail page."
        fields:
          - name: image
            label: Photo
            type: image
            required: true
            options: { media: images }
          - { name: caption, label: Caption, type: string }
          - { name: title, label: Photo title, type: string }
      - { name: link, label: Live project URL, type: string }
      - { name: source, label: Source code URL, type: string }
      - { name: featured, label: Show on homepage, type: boolean }
      - { name: published, label: Published, type: boolean }
      - { name: body, label: Full story, type: rich-text, description: "Optional. Add details only if needed." }
    list: true

  - name: research
    label: Research & publications
    type: file
    path: src/lists/research.json
    format: json
    fields:
      - { name: id, label: Page address, type: string, description: "Optional for new entries: uses the title when empty. Keep existing addresses unchanged to retain shared links." }
      - { name: title, label: Title, type: string, required: true }
      - { name: summary, label: Short summary, type: text, required: true }
      - { name: date, label: Date, type: date, required: true }
      - { name: venue, label: Journal or conference, type: string }
      - name: image
        label: Cover image
        type: image
        options: { media: images }
      - { name: link, label: Publication URL, type: string }
      - name: pdf
        label: Paper PDF
        type: file
        options: { media: documents, extensions: [ pdf ] }
      - { name: published, label: Published, type: boolean }
      - { name: body, label: Abstract or details, type: rich-text }
    list: true

  - name: certificates
    label: Certificates
    type: file
    path: src/lists/certificates.json
    format: json
    fields:
      - { name: id, label: Page address, type: string, description: "Optional for new entries: uses the title when empty. Keep existing addresses unchanged to retain shared links." }
      - { name: title, label: Title, type: string, required: true }
      - { name: summary, label: Short summary, type: text, required: true }
      - { name: date, label: Issue date, type: date, required: true }
      - { name: issuer, label: Issuer, type: string }
      - name: image
        label: Certificate image
        type: image
        options: { media: images }
      - { name: featureCover, label: Show certificate in gallery, type: boolean }
      - { name: homepageCover, label: Feature cover on homepage, type: boolean, description: "Select for the three-photo homepage row. Also includes this image in Gallery. Display order controls priority if more than three are selected." }
      - { name: link, label: Credential URL, type: string }
      - name: pdf
        label: Certificate PDF
        type: file
        options: { media: documents, extensions: [ pdf ] }
      - { name: published, label: Published, type: boolean }
      - { name: body, label: Details, type: rich-text }
    list: true

  - name: achievements
    label: Achievements & awards
    type: file
    path: src/lists/achievements.json
    format: json
    fields:
      - { name: id, label: Page address, type: string, description: "Optional for new entries: uses the title when empty. Keep existing addresses unchanged to retain shared links." }
      - { name: title, label: Title, type: string, required: true }
      - { name: summary, label: Short summary, type: text, required: true }
      - { name: date, label: Date, type: date, required: true }
      - { name: organization, label: Organization, type: string }
      - name: image
        label: Image
        type: image
        options: { media: images }
      - { name: featureCover, label: Show cover in gallery, type: boolean, description: "Includes this photo in the full Gallery. Leave off to keep it only in its original entry." }
      - { name: homepageCover, label: Feature cover on homepage, type: boolean, description: "Select for the three-photo homepage row. Also includes this image in Gallery. Display order controls priority if more than three are selected." }
      - name: gallery
        label: Gallery photos
        type: object
        list: true
        description: Optional. Add multiple photos for this award or achievement. Existing cover images remain unchanged.
        fields:
          - name: image
            label: Photo
            type: image
            required: true
            options: { media: images }
          - { name: caption, label: Caption, type: string }
          - { name: title, label: Photo title, type: string, description: "Optional. Uses the award title when empty." }
          - { name: featured, label: Show in gallery, type: boolean, description: "Select this photo for the full Gallery. Homepage selection below is separate." }
          - { name: homepage, label: Feature on homepage, type: boolean, description: "Select for the three-photo homepage row. Also includes this photo in Gallery." }
          - { name: order, label: Photo display order, type: number, description: "Optional. Lower numbers appear first in Gallery and the homepage row; uses the entry display order when empty." }
      - { name: link, label: More information URL, type: string }
      - { name: published, label: Published, type: boolean }
      - { name: body, label: Details, type: rich-text }
    list: true

  - name: gallery
    label: Gallery
    type: file
    path: src/lists/gallery.json
    format: json
    fields:
      - { name: linkedImage, type: string, hidden: true }
      - { name: linkedData, type: string, hidden: true }
      - { name: relatedHref, type: string, hidden: true }
      - { name: relatedLabel, type: string, hidden: true }
      - { name: id, label: Page address, type: string, description: "Optional for new entries: uses the title when empty. Keep existing addresses unchanged to retain shared links." }
      - { name: title, label: Title, type: string, required: true }
      - { name: summary, label: Caption or short description, type: text, required: true, description: "Photos selected in Awards or Certificates appear here after deployment. You can edit captions and drag records here. To remove a linked record, uncheck its Gallery/homepage options in the original entry." }
      - { name: date, label: Date, type: date, required: true }
      - name: image
        label: Photo
        type: image
        required: true
        options: { media: images }
      - { name: location, label: Location or event, type: string }
      - { name: link, label: Related URL, type: string }
      - { name: featured, label: Feature on homepage, type: boolean, description: "Published gallery entries appear in Gallery. This option additionally selects the homepage preview." }
      - { name: published, label: Published, type: boolean }
    list: true
